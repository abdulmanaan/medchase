<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MedChase</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Figtree:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="home">
    <header>
      <nav>
        <a class="logo" href="/">MedChase</a>
        <a class="nav-link" href="pharmacies.html">Pharmacies</a>
      </nav>
    </header>

    <main>
      <div class="hero">
        <h1>Find your medicine</h1>
        <p>See which pharmacies have it in stock before you leave home.</p>
      </div>

      <form class="capsule-form" id="search-form">
        <label class="visually-hidden" for="search-input">Medicine name</label>
        <input
          class="capsule-input"
          id="search-input"
          type="search"
          placeholder="e.g. Panadol"
          required
          autocomplete="off"
        />
        <button class="capsule-button" type="submit">Search</button>
      </form>

      <ul class="search-results" id="results"></ul>
    </main>
    <script src="js/search.js" defer></script>
  </body>
</html>
