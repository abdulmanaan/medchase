<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#9FCE5A" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Figtree:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="page">
    <header>
      <nav>
        <a class="logo" href="/">
          <img
            class="logo-mark"
            src="/images/logo.svg"
            alt=""
            width="36"
            height="30"
          />
          MedChase
        </a>
        <a class="nav-link" href="pharmacies.html">Pharmacies</a>
      </nav>
    </header>

    <main class="narrow">
      <a href="pharmacies.html" class="back-link">Back to pharmacies</a>
      <h1 id="pharmacy-name"></h1>
      <p class="page-intro" id="pharmacy-location"></p>

      <section class="panel">
        <h2>Medicines in stock</h2>
        <form class="capsule-form" id="medicine-form">
          <label class="visually-hidden" for="medicine-name"
            >Medicine name</label
          >
          <input
            class="capsule-input"
            id="medicine-name"
            type="text"
            placeholder="Add a medicine"
            required
            autocomplete="off"
          />
          <button class="capsule-button" type="submit">Add</button>
        </form>
        <p class="form-message" id="form-message"></p>
        <ul class="item-list" id="medicine-list"></ul>
      </section>
    </main>

    <script src="js/pharmacy.js" defer></script>
  </body>
</html>
